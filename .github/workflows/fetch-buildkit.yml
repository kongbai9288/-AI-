name: Fetch MC Build Kit

# 仅作为「下载代理」: 在无外网的环境里, 由 Actions 代为抓取
# Minecraft 本体与编译期依赖, 打包成 artifact 供本地 javac 使用。
on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft 目标版本'
        required: false
        default: '26.2'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取 MC 本体与依赖
        run: python3 scripts/fetch_buildkit.py "${{ inputs.mc_version || '26.2' }}" buildkit

      - name: 清单
        run: |
          echo "=== buildkit ==="
          ls -lh buildkit/ | head -20
          echo "=== classpath 条目 ==="
          tr ':' '\n' < buildkit/classpath.txt | wc -l

      - name: 上传 buildkit
        uses: actions/upload-artifact@v4
        with:
          name: buildkit-${{ inputs.mc_version || '26.2' }}
          path: buildkit/
          retention-days: 30
