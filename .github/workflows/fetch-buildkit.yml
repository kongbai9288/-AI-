name: Fetch MC Build Kit

# 仅作为「下载代理」: 在无外网的环境里, 由 Actions 代为抓取
# Minecraft 本体与编译期依赖, 推送到 buildkit 分支供外部取用。
on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft 目标版本'
        required: false
        default: '26.2'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取 MC 本体与依赖
        run: python3 scripts/fetch_buildkit.py "${{ inputs.mc_version || '26.2' }}" buildkit

      - name: 清单
        run: |
          echo "=== buildkit ==="
          ls -lh buildkit/ | head -20
          echo "=== classpath 条目 ==="
          tr ':' '\n' < buildkit/classpath.txt | wc -l
          du -sh buildkit/

      - name: 打包分卷
        run: |
          rm -rf /tmp/bk && mkdir -p /tmp/bk
          cd buildkit
          tar czf - . | split -b 90m -d -a 2 - /tmp/bk/buildkit.tar.gz.part-
          cd /tmp/bk && ls -lh

      - name: 推送到 buildkit 分支
        run: |
          cd /tmp/bk
          git init -q .
          git checkout -q -b buildkit
          git add -A
          git commit -q -m "buildkit: MC ${{ inputs.mc_version || '26.2' }} @ $(date -u +%Y%m%dT%H%M%SZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin buildkit
          echo "已推送 buildkit 分支"
