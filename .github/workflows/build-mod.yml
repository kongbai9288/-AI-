name: Build RollingLog Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'rollinglog/**'

permissions:
  contents: write

concurrency:
  group: build-mod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: 解析最新 Loom 版本
        run: |
          LOOM=$(curl -sSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml \
                | grep -o '<version>[^<]*</version>' | tail -1 | sed 's/<\/*version>//g')
          echo "解析到 loom: $LOOM"
          sed -i "s/^loom_version=.*/loom_version=$LOOM/" rollinglog/gradle.properties

      - name: 准备 Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          mkdir -p "$RUNNER_TEMP/gdist"
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP/gdist"
          echo "$RUNNER_TEMP/gdist/gradle-8.14.3/bin" >> $GITHUB_PATH

      - name: 构建
        id: gradle
        working-directory: rollinglog
        continue-on-error: true
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 收集结果
        if: always()
        run: |
          mkdir -p build-out
          if ls rollinglog/build/libs/*.jar >/dev/null 2>&1; then
            cp rollinglog/build/libs/*.jar build-out/
            echo "BUILD_OK=true" >> $GITHUB_ENV
          else
            echo "BUILD_OK=false" >> $GITHUB_ENV
          fi
          cp rollinglog/build.log build-out/build.log 2>/dev/null || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollinglog-out
          path: build-out/
          retention-days: 7

      - name: 提交结果到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A build-out/
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "build: rollinglog (ok=$BUILD_OK)"
            git push
          fi
