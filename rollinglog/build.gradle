buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }   // Fabric Maven (loader/yarn/API/loom)
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // loom_version 定义在 gradle.properties, 便于脚本按 MC 版本替换
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'

version      = project.mod_version
group        = project.maven_group
base.archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"

loom {
    // 需要访问受保护名称时开启官方映射:
    // accessWidenerPath = file("src/main/resources/${project.archives_base_name}.accesswidener")
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    // Minecraft 本体由 Loom 自动从 Mojang 官方服务器拉取（遵守 EULA）
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API（可选, 但绝大多数 mod 都需要）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version,
               "java_version": project.java_version
    }
}

java {
    // 注意: java_version 取决于 MC 版本, 详见 README
    toolchain { languageVersion = JavaLanguageVersion.of(project.java_version) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
    options.encoding = "UTF-8"
}

jar {
    from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}

// 输出到 build/libs/
